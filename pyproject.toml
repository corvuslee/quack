[project]
name = "quack"
version = "0.4.0"
requires-python = ">=3.11"
authors = [
    {name = "corvuslee"}
]
description = "DuckDuckGo search with browser impersonation"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "beautifulsoup4>=4.14.3",
    "html2text>=2025.4.15",
    "primp>=2.0.1",
]

[project.scripts]
quack = "quack.cli:main"

[project.urls]
homepage = "https://github.com/corvuslee/quack"
repository = "https://github.com/corvuslee/quack"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]
render = [
    "seleniumbase>=4.48.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.17.5",
    "ty>=0.0.102",
]

[tool.ruff]
extend-exclude = ["openwiki"]
